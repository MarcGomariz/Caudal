<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caudal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Caudal · Finanzas personales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
/* VOICE: calm private-banking statement — precise, quiet, confident.
   IDEA: a bank's monthly statement turned into a live instrument panel.
   PICTURE: the "disponible" figure with its spending meter and pace mark; charts below.
   COLOUR and TYPE: deep sea #0a2540 ground, sky #8fd3ff (ingresos/acciones), pink #ff5c8a (gasto/alerta), white ink; Hanken Grotesk 300 for big figures.
   LAYOUT: sidebar + content on desktop, top bar + bottom tabs on phone; one hero strip, then two-column chart rows. */
:root{color-scheme:dark;--bg:#0a2540;--p1:#0f2d4d;--p2:#143a63;--p3:#1b4776;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--ink:#fff;--ink2:#b9cbe0;--mut:#86a0bc;--sky:#8fd3ff;--pink:#ff5c8a;--ok:#3fd07a;--warn:#fab219;--ser:#ec835a;--crit:#ff6b7d;--r:16px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#0b2a49,#0a2540)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:-.01em;padding:0 10px 22px}
.logo svg{width:28px;height:28px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:500;min-height:44px}
.nav a svg{width:20px;height:20px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.nav a[aria-current=page]{background:var(--p2);color:var(--ink)}
.nav a[aria-current=page] svg{color:var(--sky);opacity:1}
.side .grow{flex:1}
.sync{font-size:13px;color:var(--mut);padding:8px 12px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok)}.dot.busy{background:var(--warn)}
.top{display:none}
.tabs{display:none}
main{padding:clamp(20px,3.2vw,44px) clamp(16px,3.2vw,44px) 80px;max-width:1240px;width:100%;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--p2);cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--p3)}
.btn.pri{background:var(--sky);color:#06213d;border-color:transparent}
.btn.pri:hover{background:#b3e1ff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--crit)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--p1);border:1px solid var(--line2);border-radius:10px;min-height:44px;padding:0 12px;font-size:16px;width:100%}
textarea{padding:10px 12px;min-height:120px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-weight:300;font-size:clamp(32px,4.4vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.005em}
h3{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--ink2);margin:6px 0 0}
.mut{color:var(--mut)}.small{font-size:14px}.tiny{font-size:13px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.mt{margin-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.monthsw{display:flex;align-items:center;gap:4px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:4px}
.monthsw button{background:none;border:0;min-width:40px;min-height:40px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.monthsw button:hover{background:var(--p2);color:var(--ink)}
.monthsw span{min-width:130px;text-align:center;font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.big{background:linear-gradient(135deg,#123b66 0%,#0f2d4d 60%);border:1px solid var(--line);border-radius:22px;padding:28px;position:relative;overflow:hidden}
.big .lbl{color:var(--ink2);font-weight:500}
.big .fig{font-weight:300;font-size:clamp(46px,7vw,76px);line-height:1;letter-spacing:-.03em;margin:10px 0 6px;white-space:nowrap}
.big .fig.neg{color:var(--pink)}
.meter{position:relative;height:14px;border-radius:8px;background:rgba(255,255,255,.08);margin:26px 0 8px;overflow:visible}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--sky)}
.meter i.over{background:var(--pink)}
.meter b{position:absolute;top:-8px;bottom:-8px;width:2px;background:#fff;border-radius:2px}
.meter b::after{content:"hoy";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink2);font-weight:500}
.mleg{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:clamp(24px,2.6vw,30px);font-weight:400;letter-spacing:-.02em;white-space:nowrap}
.kpi .l{font-size:14px;color:var(--ink2)}
.delta{font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--ink2)}
.delta svg{width:14px;height:14px}
.delta.bad svg{color:var(--pink)}.delta.good svg{color:var(--ok)}
/* alerts */
.alerts{display:grid;gap:10px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--p1);border:1px solid var(--line);border-left:4px solid var(--c,var(--mut))}
.al svg{width:22px;height:22px;color:var(--c)}
.al .t{font-weight:600}.al .d{font-size:14px;color:var(--ink2)}
.al.crit{--c:var(--crit)}.al.ser{--c:var(--ser)}.al.warn{--c:var(--warn)}.al.info{--c:var(--sky)}.al.ok{--c:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink2);white-space:nowrap}
.tag.crit{background:rgba(255,107,125,.14);color:#ffb3bd}.tag.warn{background:rgba(250,178,25,.14);color:#ffd77a}.tag.ok{background:rgba(63,208,122,.14);color:#8ff0b6}.tag.sky{background:rgba(143,211,255,.14);color:var(--sky)}
/* charts */
.chart{position:relative;height:280px}
.chart.sm{height:220px}
.donutwrap{display:grid;grid-template-columns:minmax(140px,180px) minmax(0,1fr);gap:20px;align-items:center}
.donutwrap .chart{height:200px}
.legend{display:grid;gap:8px;font-size:14px}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.legend i,.sw{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.legend span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.legend span:nth-child(3){white-space:nowrap}
.legend span:last-child{color:var(--mut);width:42px;text-align:right}
.hbar{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:14px}
.hb .tr{height:10px;background:rgba(255,255,255,.07);border-radius:6px;position:relative}
.hb .tr i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.hb .n{text-align:right;white-space:nowrap}
.cmp{display:grid;gap:2px}
.cmp div{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 92px;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.cmp div:last-child{border:0}
.cmp .h{color:var(--mut);font-size:13px}
.cmp span:not(:first-child){text-align:right;white-space:nowrap}
.up{color:#ffa3b8}.down{color:#8ff0b6}
/* table-ish lists */
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mlist{display:grid}
.mr{display:grid;grid-template-columns:96px minmax(0,1fr) 210px 120px 40px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.mr.h{color:var(--mut);font-size:13px;padding-top:0}
.mr .c{overflow:hidden}
.mr .c b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .c small{color:var(--mut);font-size:13px}
.mr .a{text-align:right;white-space:nowrap;font-weight:500}
.pos{color:var(--sky)}
.mr select{min-height:38px;font-size:14px;border-radius:9px}
.ib{background:none;border:0;width:40px;height:40px;border-radius:10px;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--p2);color:var(--ink)}
.ib svg{width:18px;height:18px}
.src{font-size:12px;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--mut);margin-left:6px;white-space:nowrap}
.src.low{background:rgba(250,178,25,.14);color:#ffd77a}
.tot{display:flex;gap:18px;justify-content:flex-end;padding:12px 4px;color:var(--ink2);font-size:14px;flex-wrap:wrap}
/* budgets */
.bud{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) 130px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border:0}
.bud .tr{height:12px;background:rgba(255,255,255,.07);border-radius:7px;position:relative}
.bud .tr i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--sky)}
.bud .tr i.w{background:var(--warn)}.bud .tr i.o{background:var(--pink)}
.bud .tr b{position:absolute;top:-5px;bottom:-5px;width:2px;background:rgba(255,255,255,.7)}
.bud .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:6px;gap:8px;flex-wrap:wrap}
.bud input{text-align:right}
/* forecast table */
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
/* AI */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:300}
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.in{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.in .imp{font-size:22px;font-weight:300;letter-spacing:-.01em}
.in p{margin:0;color:var(--ink2);font-size:15px}
.in .act{font-size:14px;color:var(--ink);background:rgba(143,211,255,.08);border-radius:10px;padding:10px 12px}
.chat{display:grid;gap:12px;max-height:460px;overflow:auto;padding:4px}
.msg{padding:12px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;font-size:15px}
.msg.u{background:var(--p3);justify-self:end}
.msg.a{background:var(--p2);justify-self:start}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:rgba(143,211,255,.08);border:1px solid rgba(143,211,255,.22);margin-bottom:18px;font-size:15px}
.banner .sp{min-width:200px}
.banner>svg{width:22px;height:22px;flex:none;color:var(--sky)}
.empty{padding:40px 10px;text-align:center;color:var(--ink2)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,14,28,.66);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--p1);border:1px solid var(--line2);border-radius:20px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.sheet.narrow{width:min(520px,100%)}
.drop{border:2px dashed var(--line2);border-radius:18px;padding:40px 20px;text-align:center;cursor:pointer;transition:background .2s}
.drop.on,.drop:hover{background:rgba(143,211,255,.06);border-color:var(--sky)}
.drop svg{width:44px;height:44px;color:var(--sky)}
.pv{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pv table{font-size:14px}
.pv tr.dup td{opacity:.45}
.pv td{padding:8px 10px}
.mapg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--sky)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(560px,calc(100% - 24px))}
.toast{background:#1d4a7a;border:1px solid var(--line2);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4);font-size:15px}
.toast .sp{min-width:0}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--sky);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.catl{display:grid}
.catr{display:grid;grid-template-columns:28px minmax(0,1fr) 120px 70px 40px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.catr input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.kv>span:last-child{text-align:right}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
@media(max-width:1100px){.hero{grid-template-columns:minmax(0,1fr)}.g64{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(10,37,64,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
 .top .logo{padding:0;font-size:18px}
 .top .sync{padding:0 4px;font-size:12px}
 .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(11,42,73,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);text-decoration:none;min-height:48px;justify-content:center;border-radius:10px}
 .tabs a svg{width:22px;height:22px}
 .tabs a[aria-current=page]{color:var(--sky)}
 main{padding-bottom:110px}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 .toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .toolbar .q{grid-column:1/-1}
 #toasts{bottom:86px}
}
@media(max-width:640px){
 .donutwrap{grid-template-columns:minmax(0,1fr)}
 .donutwrap .chart{height:190px}
 .mr{grid-template-columns:minmax(0,1fr) auto 40px;gap:4px 10px}
 .mr.h{display:none}
 .mr .d{grid-column:1/-1;font-size:13px;color:var(--mut)}
 .mr .c{grid-column:1;grid-row:2}
 .mr .a{grid-column:2;grid-row:2}
 .mr .x{grid-column:3;grid-row:2/4}
 .mr .s{grid-column:1/3;grid-row:3}
 .bud{grid-template-columns:minmax(0,1fr) 110px}
 .bud .bw{grid-column:1/-1;grid-row:2}
 .cmp div{grid-template-columns:minmax(0,1fr) 72px 80px}
 .cmp span:nth-child(2){display:none}
 .mapg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .score{grid-template-columns:minmax(0,1fr);justify-items:start}
 .catr{grid-template-columns:28px minmax(0,1fr) 40px}
 .catr .k,.catr .cnt{display:none}
 .sheet{padding:18px}
 .hb{grid-template-columns:minmax(80px,110px) minmax(0,1fr) 54px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#8fd3ff"/><path d="M7 20c3-6 6-6 9-2s6 4 9-2" stroke="#0a2540" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M7 13c3-5 6-5 9-1.6s6 3.4 9-1.4" stroke="#0a2540" stroke-width="2" fill="none" stroke-linecap="round" opacity=".45"/></svg>Caudal</div>
  <nav class="nav" id="nav"></nav>
  <div class="grow"></div>
  <button class="btn pri" data-act="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Subir extracto</button>
  <div class="sync" id="sync"><span class="dot"></span><span>Conectando…</span></div>
 </aside>
 <div>
  <header class="top">
   <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#8fd3ff"/><path d="M7 20c3-6 6-6 9-2s6 4 9-2" stroke="#0a2540" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>Caudal</div>
